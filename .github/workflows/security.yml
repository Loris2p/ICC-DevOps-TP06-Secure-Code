name: Security Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # 4.2.2
        with:
          fetch-depth: 0

      - name: Installer Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # 5.4.0
        with:
          python-version: '3.12'

      - name: Run Bandit (SAST)
        run: |
          pip install bandit
          bandit -r app -ll

      - name: Run pip-audit (dépendances)
        run: |
          pip install pip-audit
          pip-audit -r app/requirements.txt --strict

      - name: Run Gitleaks (secrets)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 #2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy (scan vulnérabilités)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'

      - name: SBOM (CycloneDX - point 22)
        run: |
          pip install cyclonedx-bom
          cyclonedx-py requirements app/requirements.txt -o sbom.json